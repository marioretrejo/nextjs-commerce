# ─── VoiceOS Render deployment ─────────────────────────────────────────────────
#
# Two persistent background workers:
#   A. voiceos-agent-worker      — LiveKit voice agent (handles live calls)
#   B. voiceos-operational-worker — recurring job loops (post-call, health, alerts)
#
# The Next.js frontend/API is deployed separately on Vercel.
#
# Setup:
#   1. Push repo to GitHub
#   2. Render Dashboard → New → Blueprint → connect repo
#   3. Fill env vars marked sync:false in the Render UI
#   4. Deploy
#
# Plans:
#   agent-worker:       starter+ ($14/mo) — always-on, concurrent calls
#   operational-worker: starter  ($7/mo)  — light I/O, no voice processing
# ───────────────────────────────────────────────────────────────────────────────

services:
  # ── Web app (Next.js frontend + API) ─────────────────────────────────────────
  # Public web service — gives the app a Render URL. Render injects PORT; the
  # start script binds 0.0.0.0. Fill the sync:false env vars in the Render UI.
  - type: web
    name: voiceos-web
    env: node
    plan: starter
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /login
    envVars:
      # Supabase (required)
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # App URL (set to this service's public URL once created)
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # Internal server-to-server auth (analyze-call, qa/score, cron)
      - key: INTERNAL_API_SECRET
        sync: false
      # AI providers used by analysis/transcription
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      # Stripe (billing) — public key needed at build for client bundles
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NODE_ENV
        value: production

  # ── A. Voice Agent Worker ────────────────────────────────────────────────────
  # Handles LiveKit voice sessions. Scale horizontally for more concurrent calls.
  - type: worker
    name: voiceos-agent-worker
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: true
    numInstances: 1
    envVars:
      # LiveKit (required)
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

      # AI providers (required)
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # Supabase (required)
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Twilio (required for outbound dialing)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false

      # Webhook signing (recommended)
      - key: VOICEOS_WEBHOOK_SIGNING_SECRET
        sync: false

      # Optional
      - key: SUPPORT_TRANSFER_NUMBER
        sync: false
      - key: NODE_ENV
        value: production

  # ── B. Operational Worker ────────────────────────────────────────────────────
  # Runs recurring job loops: post-call processing, health checks, alerting.
  # Does NOT handle voice sessions — keep separate for isolation and scaling.
  #
  # Feature flags (set in Render Dashboard env vars):
  #   VOICEOS_OPERATIONAL_WORKER_ENABLED=true   (must be true to start)
  #   VOICEOS_RUN_POST_CALL_JOBS=true
  #   VOICEOS_RUN_PROVIDER_HEALTH=true
  #   VOICEOS_RUN_ALERTS=true
  #   VOICEOS_RUN_CAMPAIGN_DIAL=false           (OFF by default — enables real calls)
  #   VOICEOS_RUN_RECOVERY=false               (OFF by default — manual only)
  #   VOICEOS_ALERTING_SEND_EXTERNAL=false     (OFF by default — no Slack/email)
  - type: worker
    name: voiceos-operational-worker
    env: node
    buildCommand: pnpm install
    startCommand: pnpm start:operational-worker
    plan: starter
    autoDeploy: true
    numInstances: 1
    envVars:
      # Supabase (required)
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Internal auth (required for campaign-dial proxy)
      - key: INTERNAL_API_SECRET
        sync: false

      # App URL (required for campaign-dial proxy)
      - key: NEXT_PUBLIC_APP_URL
        sync: false

      # Webhook signing (recommended)
      - key: VOICEOS_WEBHOOK_SIGNING_SECRET
        sync: false

      # Feature flags
      - key: VOICEOS_OPERATIONAL_WORKER_ENABLED
        value: "true"
      - key: VOICEOS_RUN_POST_CALL_JOBS
        value: "true"
      - key: VOICEOS_RUN_PROVIDER_HEALTH
        value: "true"
      - key: VOICEOS_RUN_ALERTS
        value: "true"
      # Continuous dialer: the operational worker calls campaign-dial every 60s.
      # Safe to run alongside any other trigger — contact claiming is race-free
      # (compare-and-swap on status='pending' in the dial route).
      - key: VOICEOS_RUN_CAMPAIGN_DIAL
        value: "true"
      - key: VOICEOS_RUN_RECOVERY
        value: "false"

      # Safety flags
      - key: VOICEOS_ALERTING_SEND_EXTERNAL
        value: "false"
      - key: VOICEOS_LOAD_TEST_MODE
        value: "false"
      - key: NODE_ENV
        value: production
